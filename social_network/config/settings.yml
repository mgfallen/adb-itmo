source:
  encoding: cp1251
  delimiter: ","
  timestamp_max_fraction: 6
  files:
    people: people.csv
    groups: groups.csv
    chats: chats.csv
  defaults:
    group_status: active
    chat_status: delivered
  reject_max: 100

dwh:
  staging_schema: staging
  dv_schema: dvs
  marts_schema: marts
  sys_marts_schema: sys_marts
  reject_suffix: _rej

schedules:
  build_marts: "0 4 * * *"
  sys_marts_refresh: "30 4 * * *"
