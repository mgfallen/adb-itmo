services:
  # PostgreSQL — доменные таблицы (Задание 1), external_source (Задание 2), logs (Задание 3)
  db:
    image: postgres:16-alpine
    container_name: handmade-market-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-handmade_market}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - handmade_market_pgdata:/var/lib/postgresql/data
      # Автоинициализация только up-миграциями: down-файлы из migrations/
      # в initdb.d не должны выполняться. Откат — через scripts/migrate.sh down.
      - ./migrations/0001_create_domain_tables.up.sql:/docker-entrypoint-initdb.d/01_domain_tables.sql:ro
      - ./migrations/0002_create_external_source.up.sql:/docker-entrypoint-initdb.d/02_external_source.sql:ro
      - ./migrations/0003_create_logs.up.sql:/docker-entrypoint-initdb.d/03_logs.sql:ro
      - ./migrations/0004_seed_demo_data.up.sql:/docker-entrypoint-initdb.d/04_seed_demo_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    container_name: handmade-market-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - handmade_market_mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping: 1})"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Веб-UI для MongoDB (аналог pgAdmin): http://localhost:8082
  mongo-express:
    image: mongo-express:1.0.2
    container_name: handmade-market-mongo-express
    ports:
      - "${MONGO_EXPRESS_PORT:-8082}:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-admin}
    depends_on:
      mongo:
        condition: service_healthy

  airflow:
    image: apache/airflow:2.10.3
    container_name: handmade-market-airflow
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Зависимости DAG-ов — в requirements.txt (монтируется ниже)
      _PIP_ADDITIONAL_REQUIREMENTS: "-r /opt/airflow/requirements.txt"
      # Подключения для задач DAG-ов; дефолт совпадает с dags/*.py
      PG_DSN: ${PG_DSN:-postgresql://postgres:postgres@db:5432/handmade_market}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DB: ${MONGO_DB:-handmade_market}
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./data/csv:/opt/airflow/data/csv:ro
      - ./requirements.txt:/opt/airflow/requirements.txt:ro
      - airflow_home:/opt/airflow
    ports:
      - "8080:8080"
    command: bash -c "airflow standalone"
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  handmade_market_pgdata:
  handmade_market_mongodata:
  airflow_home:
